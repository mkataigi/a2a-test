name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # lockfile 固定インストール（pnpm install --frozen-lockfile は pnpm-lock.yaml を厳密に遵守）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # テスト実行
      - name: Run tests
        run: pnpm test
